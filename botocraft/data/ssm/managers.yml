---
Parameter:
  methods:
    create:
      boto3_name: put_parameter
      response_attr: Version
      args:
        Overwrite:
          default: "False"
    update:
      decorators:
        - name: parameter_update_writes_tags
          import_path: botocraft.mixins.ssm
      boto3_name: put_parameter
      response_attr: Version
      args:
        Tags:
          hidden: true
      defaults:
        Overwrite:
          default: "True"
    get:
      decorators:
        - name: single_parameter_include_tags
          import_path: botocraft.mixins.ssm
      boto3_name: get_parameters
      args:
        Names:
          required: true
          rename: Name
          python_type: str
          source_arg: "[Name]"
          docstring: >-
            The name of the parameter you want to query.
        WithDecryption:
          default: "True"
    get_many:
      boto3_name: get_parameters
      args:
        WithDecryption:
          default: "True"
    list:
      boto3_name: describe_parameters
      return_type: >-
        "builtins.list[ParameterMetadata]"
      response_attr: Parameters
    delete:
      boto3_name: delete_parameter

