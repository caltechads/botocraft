---
Event:
  methods:
    create:
      boto3_name: create_event
      response_attr: event
      args:
        memoryId:
          required: true
          python_type: str
        actorId:
          required: true
          python_type: str
    get:
      boto3_name: get_event
      response_attr: event
      args:
        memoryId:
          required: true
          python_type: str
        sessionId:
          required: true
          python_type: str
        actorId:
          required: true
          python_type: str
        eventId:
          required: true
    list:
      boto3_name: list_events
      response_attr: events
      args:
        memoryId:
          required: true
          python_type: str
        sessionId:
          required: true
          python_type: str
        actorId:
          required: true
          python_type: str
    delete:
      boto3_name: delete_event
      return_type: None
      args:
        memoryId:
          required: true
          python_type: str
        sessionId:
          required: true
          python_type: str
        actorId:
          required: true
          python_type: str
        eventId:
          required: true
