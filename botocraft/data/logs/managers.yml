---
LogGroup:
  mixins:
    - name: LogGroupManagerMixin
      import_path: botocraft.mixins.logs
  methods:
    create:
      decorators:
        - name: create_log_group_extended
          import_path: botocraft.mixins.logs
      boto3_name: create_log_group
      return_type: None
    delete:
      boto3_name: delete_log_group
      return_type: None
      args:
        LogGroupName:
          required: true
    get:
      decorators:
        - name: convert_log_group_tags
          import_path: botocraft.mixins.logs
      boto3_name: describe_log_groups
      response_attr: logGroups
      args:
        logGroupNamePrefix:
          hidden: true
        logGroupAccessPattern:
          hidden: true
        logGroupClass:
          hidden: true
        logGroupIdentifiers:
          rename: logGroupIdentifier
          required: true
          python_type: str
          source_arg: "[logGroupIdentifier]"
          docstring: >-
            The identifier of the log group to get.  If this is in the same account you are querying, you can use the log group name, if you also set ``includeLinkedAccounts`` to ``true``, you must use the log group ARN.
    list:
      decorators:
        - name: convert_log_groups_tags
          import_path: botocraft.mixins.logs
      boto3_name: describe_log_groups
      response_attr: logGroups
    get_fields:
      boto3_name: get_log_group_fields
      response_attr: logGroupFields
    start_query:
      boto3_name: start_query
      response_attr: None
    get_query_results:
      boto3_name: get_query_results
      response_attr: None
QueryDefinition:
  mixins:
    - name: QueryDefinitionManagerMixin
      import_path: botocraft.mixins.logs
  methods:
    create:
      boto3_name: put_query_definition
      response_attr: queryDefinitionId
      decorators:
        - name: query_definition_from_put
          import_path: botocraft.mixins.logs
    update:
      boto3_name: put_query_definition
      response_attr: queryDefinitionId
      decorators:
        - name: query_definition_from_put
          import_path: botocraft.mixins.logs
    delete:
      boto3_name: delete_query_definition
      return_type: None
      args:
        queryDefinitionId:
          required: true
    list:
      boto3_name: describe_query_definitions
      response_attr: queryDefinitions
      decorators:
        - name: paginate_query_definitions
          import_path: botocraft.mixins.logs
